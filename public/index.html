<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dark Link — Connexion & Inscription</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0a0f;
      --bg-card: #111118;
      --bg-input: #1a1a24;
      --border-color: #262638;
      --primary: #1a6eff;
      --primary-hover: #3b82f6;
      --primary-glow: rgba(26, 110, 255, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      position: relative;
      overflow-x: hidden;
    }

    .glow-blob {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(10, 10, 15, 0) 70%);
      top: 10%;
      left: 10%;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
      z-index: 0;
    }

    .glow-blob-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(10, 10, 15, 0) 70%);
      bottom: 10%;
      right: 10%;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(50px);
      z-index: 0;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #1a6eff 0%, #0d3b8f 100%);
      border-radius: 14px;
      box-shadow: 0 8px 24px var(--primary-glow);
      margin-bottom: 12px;
    }

    .brand-logo svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tagline {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .tab-switch {
      display: flex;
      background: var(--bg-input);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      min-height: 42px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 16px; /* 16px prevents mobile browser zoom */
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: #20202e;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      min-height: 48px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.4;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .hidden { display: none !important; }

    .footer-help {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: 28px 20px;
        border-radius: 16px;
      }
      .brand-title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="glow-blob"></div>
  <div class="glow-blob-2"></div>

  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12c0 1.82.49 3.53 1.34 5L2 22l5.24-1.31C8.67 21.49 10.29 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/>
        </svg>
      </div>
      <h1 class="brand-title">DARK LINK</h1>
      <p class="brand-tagline">Messagerie chiffrée, instantanée et moderne</p>
    </div>

    <!-- Switch Connexion / Inscription -->
    <div class="tab-switch">
      <button type="button" class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Connexion</button>
      <button type="button" class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">Inscription</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- FORMULAIRE DE CONNEXION -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="loginIdentifier">Email ou Téléphone</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input type="text" id="loginIdentifier" class="form-input" placeholder="alice@mail.com ou 0612345678" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Mot de passe</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="submit-btn" id="loginSubmitBtn">
        Se connecter
      </button>
    </form>

    <!-- FORMULAIRE D'INSCRIPTION -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="regUsername">Nom d'utilisateur</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input type="text" id="regUsername" class="form-input" placeholder="ex: dark_hunter" required autocomplete="nickname">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Adresse Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </span>
          <input type="email" id="regEmail" class="form-input" placeholder="ex: jean@domaine.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPhone">Numéro de Téléphone</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </span>
          <input type="tel" id="regPhone" class="form-input" placeholder="ex: 0612345678" required autocomplete="tel">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Mot de passe</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" id="regPassword" class="form-input" placeholder="Au moins 4 caractères" minlength="4" required autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="submit-btn" id="registerSubmitBtn">
        Créer mon compte
      </button>
    </form>

    <div class="footer-help">
      <span>Dark Link &copy; 2026 — Sécurité & Instantanéité</span>
    </div>
  </div>

  <script>
    const savedUser = localStorage.getItem('dark_link_user');
    if (savedUser) {
      window.location.href = 'chat.html';
    }

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }

    function clearAlert() {
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';
    }

    function switchTab(tab) {
      clearAlert();
      const loginBtn = document.getElementById('tabLoginBtn');
      const registerBtn = document.getElementById('tabRegisterBtn');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (tab === 'login') {
        loginBtn.classList.add('active');
        registerBtn.classList.remove('active');
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
      } else {
        registerBtn.classList.add('active');
        loginBtn.classList.remove('active');
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearAlert();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.textContent = 'Connexion...';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await res.json();
        if (!res.ok) {
          showAlert(data.error || 'Identifiant ou mot de passe incorrect.');
          btn.disabled = false;
          btn.textContent = 'Se connecter';
          return;
        }

        localStorage.setItem('dark_link_user', JSON.stringify(data.user));
        if (data.token) {
          localStorage.setItem('dark_link_token', data.token);
        }
        showAlert('Connexion réussie !', 'success');
        setTimeout(() => {
          window.location.href = 'chat.html';
        }, 500);
      } catch (err) {
        showAlert('Impossible de contacter le serveur.');
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearAlert();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('registerSubmitBtn');

      btn.disabled = true;
      btn.textContent = 'Création...';

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, phone, password })
        });

        const data = await res.json();
        if (!res.ok) {
          showAlert(data.error || 'Erreur lors de l\'inscription.');
          btn.disabled = false;
          btn.textContent = 'Créer mon compte';
          return;
        }

        showAlert('Compte créé avec succès ! Connectez-vous.', 'success');
        setTimeout(() => {
          switchTab('login');
          document.getElementById('loginIdentifier').value = email;
          btn.disabled = false;
          btn.textContent = 'Créer mon compte';
        }, 1000);
      } catch (err) {
        showAlert('Impossible de contacter le serveur.');
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    }
  </script>
</body>
</html>
