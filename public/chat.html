    async function toggleVoiceRecording() {
      if (isRecording) {
        stopVoiceRecording();
      } else {
        startVoiceRecording();
      }
    }

    async function startVoiceRecording() {
      if (!currentChat) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus'
          : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';

        mediaRecorder = new MediaRecorder(stream, { mimeType });
        audioChunks = [];

        mediaRecorder.addEventListener('dataavailable', e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        });

        mediaRecorder.addEventListener('stop', async () => {
          stream.getTracks().forEach(t => t.stop());
          const ext = mimeType.includes('ogg') ? 'ogg' : 'webm';
          const blob = new Blob(audioChunks, { type: mimeType });
          await uploadAndSendVoice(blob, ext);
        });

        mediaRecorder.start();
        isRecording = true;
        recSeconds = 0;

        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('voiceRecordingBar').style.display = 'flex';
        document.getElementById('messageInputWrap').style.display = 'none';

        recTimerInterval = setInterval(() => {
          recSeconds++;
          const m = Math.floor(recSeconds / 60);
          const s = recSeconds % 60;
          document.getElementById('recTimer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
          // Limite automatique à 2 minutes
          if (recSeconds >= 120) stopVoiceRecording();
        }, 1000);

      } catch (err) {
        if (err.name === 'NotAllowedError') {
          alert('Accès au microphone refusé. Autorisez le microphone dans les paramètres de votre navigateur.');
        } else {
          alert('Impossible d\'accéder au microphone : ' + err.message);
        }
      }
    }

    function stopVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      clearInterval(recTimerInterval);
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('voiceRecordingBar').style.display = 'none';
      document.getElementById('messageInputWrap').style.display = 'flex';
    }

    function cancelVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        // Vider les chunks pour ne pas envoyer
        mediaRecorder.addEventListener('stop', () => { audioChunks = []; }, { once: true });
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        mediaRecorder.stop();
      }
      clearInterval(recTimerInterval);
      isRecording = false;
      audioChunks = [];
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('voiceRecordingBar').style.display = 'none';
      document.getElementById('messageInputWrap').style.display = 'flex';
    }

    async function uploadAndSendVoice(blob, ext) {
      if (!currentChat || audioChunks.length === 0 || blob.size < 1000) return;
      const formData = new FormData();
      formData.append('media', blob, `voice_${Date.now()}.${ext}`);

      try {
        const res = await fetch('/api/upload/media', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok && data.mediaUrl) {
          if (currentChat.type === 'direct') {
            socket.emit('send_message', {
              sender_id: currentUser.id,
              receiver_id: currentChat.id,
              content: data.mediaUrl,
              media_type: 'audio'
            });
          } else if (currentChat.type === 'group') {
            socket.emit('send_group_message', {
              sender_id: currentUser.id,
              group_id: currentChat.id,
              content: data.mediaUrl,
              media_type: 'audio'
            });
          }
        } else {
          alert(data.error || 'Erreur lors de l\'envoi du message vocal.');
        }
      } catch (err) {
        alert('Erreur réseau lors de l\'envoi du message vocal.');
      }
    }
    // ===== FIN LOGIQUE MESSAGES VOCAUX =====

    let isCurrentlyTyping = false;
    let typingTimer = null;
    function handleTypingEvent() {
      updateMicSendBtnVisibility();
      if (!currentChat) return;
      if (!isCurrentlyTyping) {
        isCurrentlyTyping = true;
        if (currentChat.type === 'direct') {
          socket.emit('typing', { sender_id: currentUser.id, receiver_id: currentChat.id });
        } else if (currentChat.type === 'group') {
          socket.emit('group_typing', { sender_id: currentUser.id, sender_name: currentUser.username, group_id: currentChat.id });
        }
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => stopTypingNow(), 1500);
    }

    function stopTypingNow() {
      if (isCurrentlyTyping && currentChat) {
        isCurrentlyTyping = false;
        if (currentChat.type === 'direct') {
          socket.emit('stop_typing', { sender_id: currentUser.id, receiver_id: currentChat.id });
        } else if (currentChat.type === 'group') {
          socket.emit('group_stop_typing', { sender_id: currentUser.id, group_id: currentChat.id });
        }
      }
    }

    function handleInputKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function markMessagesAsRead(senderId) {
      try {
        await authFetch('/api/messages/read', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senderId, receiverId: currentUser.id })
        });
        const f = friendsList.find(x => Number(x.id) === Number(senderId));
        if (f) { f.unread_count = 0; renderChatsList(); }
      } catch (e) {}
    }

    function handleHeaderDetailsClick() {
      if (currentChat && currentChat.type === 'group') {
        openGroupDetailsModal();
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('messagesContainer');
      container.scrollTop = container.scrollHeight;
    }

    function closeActiveChatOnMobile() {
      document.getElementById('chatView').classList.remove('active-mobile');
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function openImageModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function logout() {
      if (confirm('Voulez-vous vous déconnecter ?')) {
        localStorage.removeItem('dark_link_user');
        localStorage.removeItem('dark_link_token');
        window.location.href = 'index.html';
      }
    }

    function formatMessageTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatChatTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
    }

    function defaultAvatar() {
      return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
    }

    function defaultGroupAvatar() {
      return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231a6eff'%3E%3Cpath d='M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z'/%3E%3C/svg%3E";
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.toString().replace(/[&<>"']/g, m => map[m]);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
